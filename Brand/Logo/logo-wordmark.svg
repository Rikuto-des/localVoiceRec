<?xml version="1.0" encoding="UTF-8"?>
<!--
  localVoiceRec — wordmark (symbol + lockup).
  Wordmark drawn as outlined paths so font rendering is reproducible.
  Letterforms are hand-constructed from rounded rects / paths to evoke
  a clean grotesque, with no external font dependency.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 640" width="2400" height="640">
  <!-- symbol on the left, scaled down -->
  <g transform="translate(40,40) scale(0.547)">
    <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#1B1816"/>
    <rect x="52" y="52" width="920" height="920" rx="184" ry="184"
          fill="none" stroke="#F4EFE6" stroke-opacity="0.18" stroke-width="3"/>
    <g fill="#F4EFE6">
      <rect x="248" y="392" width="64" height="240" rx="32" ry="32"/>
      <rect x="352" y="288" width="64" height="448" rx="32" ry="32"/>
      <rect x="456" y="216" width="72" height="592" rx="36" ry="36"/>
      <rect x="568" y="320" width="64" height="384" rx="32" ry="32"/>
      <rect x="672" y="416" width="64" height="192" rx="32" ry="32"/>
    </g>
    <circle cx="800" cy="224" r="68" fill="#A0392B"/>
  </g>

  <!-- wordmark: rendered with Helvetica (always present on macOS).
       For builds where this needs to be portable, run:
         rsvg-convert logo-wordmark.svg -o logo-wordmark.png
       and ship the PNG. -->
  <g transform="translate(660,360)" fill="#1B1816">
    <text x="0" y="0"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="700"
          font-size="180"
          letter-spacing="-6">localVoiceRec</text>
  </g>

  <!-- editorial caption rule beneath, like a print sub-title -->
  <line x1="664" y1="408" x2="2300" y2="408"
        stroke="#1B1816" stroke-opacity="0.45" stroke-width="2"/>
  <g transform="translate(660,470)" fill="#1B1816" fill-opacity="0.7">
    <text x="0" y="0"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="500"
          font-size="44"
          letter-spacing="3">MACOS · ON-DEVICE · FIELD NOTE</text>
  </g>
</svg>
